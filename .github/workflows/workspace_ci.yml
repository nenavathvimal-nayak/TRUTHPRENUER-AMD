name: Truthprenuer Ecosystem Master CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ecosystem-validation:
    name: Submodule Integration & Quality Gate Validation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Parent Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify Submodule Gitlink Availability
        run: |
          git submodule status --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: TRUTHPRENUER-ADMIN/ADMIN/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          (cd TRUTHPRENUER-ADMIN/ADMIN && npm ci)
          python -m pip install --upgrade pip
          pip install -r TRUTHPRENUER-PLATFORM/backend/requirements.txt

      - name: Execute Master Ecosystem Validator
        run: |
          chmod +x DEVTOOLS/SCRIPTS/validate_workspace.sh
          ./DEVTOOLS/SCRIPTS/validate_workspace.sh
